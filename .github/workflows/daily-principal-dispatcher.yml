name: Daily Principal Dispatcher Prototype

on:
  push:
    branches:
      - research-daily-principal-dispatcher-20260923
    paths:
      - '.github/workflows/daily-principal-dispatcher.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected main probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -o /tmp/dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/protected-ref-admission-probe.yml/dispatches" \
            -d '{"ref":"main"}' | tee /tmp/http_code
          code="$(cat /tmp/http_code)"
          echo "dispatch_http=${code}"
          test "${code}" = "204"
