name: Daily Principal Dispatcher Prototype

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-principal-dispatcher.yml'
  workflow_dispatch:
    inputs:
      analysis_run_identity:
        description: 'Current Stage2 analysis run identity'
        required: false
        type: string
      input_binding_digest:
        description: 'SHA-256 digest of transient Stage2 admission envelope binding'
        required: false
        type: string
      externally_approved_sha:
        description: 'Externally approved controller SHA resolved by Stage2 from Current-Routing'
        required: false
        type: string
      t1_shadow_enabled:
        description: 'Dispatch T1 shadow controller only when explicitly bound by Stage2'
        required: false
        default: 'false'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify contents write is denied
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          payload='{"message":"daily principal contents write negative probe","content":"cHJvYmU=","branch":"'"${BRANCH}"'"}'
          curl -sS -o /tmp/write.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/contents/daily-principal-write-probe.txt" \
            -d "${payload}" | tee /tmp/write_code
          code="$(cat /tmp/write_code)"
          echo "contents_write_http=${code}"
          test "${code}" = "403"
      - name: Verify administration is denied
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -o /tmp/admin.json -w "%{http_code}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}" \
            -d '{}' | tee /tmp/admin_code
          code="$(cat /tmp/admin_code)"
          echo "administration_http=${code}"
          test "${code}" = "403"
      - name: Dispatch protected main probe
        if: ${{ inputs.t1_shadow_enabled != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -o /tmp/dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/protected-ref-admission-probe.yml/dispatches" \
            -d '{"ref":"main"}' | tee /tmp/dispatch_code
          code="$(cat /tmp/dispatch_code)"
          echo "dispatch_http=${code}"
          test "${code}" = "204"
      - name: Validate T1 shadow binding inputs
        if: ${{ inputs.t1_shadow_enabled == 'true' }}
        env:
          RUN_ID: ${{ inputs.analysis_run_identity }}
          BINDING_DIGEST: ${{ inputs.input_binding_digest }}
          APPROVED_SHA: ${{ inputs.externally_approved_sha }}
        run: |
          test -n "${RUN_ID}"
          echo "${BINDING_DIGEST}" | grep -Eq '^[0-9a-fA-F]{64}$'
          echo "${APPROVED_SHA}" | grep -Eq '^[0-9a-fA-F]{40}$'
      - name: Dispatch T1 shadow controller
        if: ${{ inputs.t1_shadow_enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.analysis_run_identity }}
          BINDING_DIGEST: ${{ inputs.input_binding_digest }}
          APPROVED_SHA: ${{ inputs.externally_approved_sha }}
        run: |
          write_code="$(cat /tmp/write_code)"
          admin_code="$(cat /tmp/admin_code)"
          python - <<'PY' > /tmp/t1_dispatch_payload.json
          import json, os
          print(json.dumps({
              'ref': 'main',
              'inputs': {
                  'analysis_run_identity': os.environ['RUN_ID'],
                  'input_binding_digest': os.environ['BINDING_DIGEST'],
                  'externally_approved_sha': os.environ['APPROVED_SHA'],
                  'contents_write_http': open('/tmp/write_code', encoding='utf-8').read().strip(),
                  'administration_http': open('/tmp/admin_code', encoding='utf-8').read().strip(),
              }
          }))
          PY
          curl -sS -o /tmp/t1_dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/t1-shadow-controller.yml/dispatches" \
            --data-binary @/tmp/t1_dispatch_payload.json | tee /tmp/t1_dispatch_code
          code="$(cat /tmp/t1_dispatch_code)"
          echo "t1_shadow_dispatch_http=${code}"
          test "${code}" = "204"
