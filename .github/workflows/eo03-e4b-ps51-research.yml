name: EO03 E4B Windows PS51 isolated diagnostics
on:
  push:
    branches:
      - research/eo03-e4b-ps51-20261013
    paths:
      - 'research/eo03/e4b/**'
      - '.github/workflows/eo03-e4b-ps51-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps51-readonly:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify E4B diagnostic script parses without execution of fixtures
        shell: powershell
        run: |
          $path = Join-Path $PWD 'research/eo03/e4b/E4B_ReadOnly_Diagnostics.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'E4B_DIAGNOSTIC_PARSE_FAILED' }
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1*') { throw 'NOT_WINDOWS_PS51' }
          Write-Output 'E4B_DIAGNOSTIC_PARSE_PASS_PS51'
      - name: Run research diagnostic only (no ZIP supplied, no child fixture execution)
        shell: powershell
        run: |
          $file = Join-Path $PWD 'research/eo03/e4b/E4B_ReadOnly_Diagnostics.ps1'
          $raw = & $file
          $report = $raw | ConvertFrom-Json
          if ($report.role -ne 'EO03_E4B_READ_ONLY_DIAGNOSTICS_ONLY') { throw 'WRONG_DIAGNOSTIC_ROLE' }
          if ($report.execution_authorized -ne $false -or $report.release_approved -ne $false) { throw 'UNEXPECTED_RELEASE_AUTHORITY' }
          $bad = @($report.findings | Where-Object { $_.status -eq 'BLOCK_FOR_E4B_RUNTIME' -or $_.status -eq 'UNKNOWN' })
          if ($bad.Count -gt 0) { $bad | ConvertTo-Json -Depth 6 | Write-Output; throw 'E4B_HOST_DIAGNOSTIC_UNEXPECTED' }
          $report | ConvertTo-Json -Depth 8 | Write-Output
          Write-Output 'E4B_HOST_OBSERVATION_ONLY_PASS'

      - name: Exercise synthetic ZIP metadata allow and deny on Windows PS51 (no extraction)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName 'System.IO.Compression'
          $diagnostic = Join-Path $PWD 'research/eo03/e4b/E4B_ReadOnly_Diagnostics.ps1'
          $tmp = Join-Path $env:RUNNER_TEMP ('EO03_E4B_' + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $tmp) { throw 'RESEARCH_TEMP_COLLISION' }
          [System.IO.Directory]::CreateDirectory($tmp) | Out-Null
          function New-ResearchZip {
            param([string]$Path, [string[]]$Names)
            $fs = [System.IO.File]::Open($Path, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
            try {
              $archive = [System.IO.Compression.ZipArchive]::new($fs, [System.IO.Compression.ZipArchiveMode]::Create, $true)
              try {
                foreach ($name in $Names) {
                  $entry = $archive.CreateEntry($name)
                  $writer = [System.IO.StreamWriter]::new($entry.Open(), [System.Text.Encoding]::ASCII)
                  try { $writer.Write('SYNTHETIC_EO03_NO_EXECUTION') } finally { $writer.Dispose() }
                }
              } finally { $archive.Dispose() }
            } finally { $fs.Dispose() }
          }
          function Assert-ResearchZip {
            param([string]$Name, [string]$Expected)
            $file = Join-Path $tmp $Name
            $report = (& $diagnostic -ZipPath $file | ConvertFrom-Json)
            if ($report.release_approved -ne $false -or $report.execution_authorized -ne $false) { throw 'UNAUTHORIZED_RESEARCH_RELEASE' }
            $finding = @($report.findings | Where-Object { $_.code -eq 'D07_ZIP_METADATA' })
            if ($finding.Count -ne 1 -or $finding[0].status -ne $Expected) {
              throw ('ZIP_METADATA_MISMATCH: ' + $Name + ' expected=' + $Expected + ' actual=' + (@($finding | ForEach-Object { $_.status }) -join ','))
            }
            Write-Output ('EO03_E4B_ZIP_CASE_PASS ' + $Name + ' status=' + $Expected)
          }
          try {
            New-ResearchZip (Join-Path $tmp 'valid.zip') @('valid_ascii.ps1')
            New-ResearchZip (Join-Path $tmp 'traversal.zip') @('../escape.ps1')
            New-ResearchZip (Join-Path $tmp 'duplicate.zip') @('file.ps1', 'FILE.ps1')
            [System.IO.File]::WriteAllText((Join-Path $tmp 'invalid.zip'), 'not a zip', [System.Text.Encoding]::ASCII)
            Assert-ResearchZip 'valid.zip' 'OBSERVED_METADATA_ONLY'
            Assert-ResearchZip 'traversal.zip' 'BLOCK_FOR_E4B_RUNTIME'
            Assert-ResearchZip 'duplicate.zip' 'BLOCK_FOR_E4B_RUNTIME'
            Assert-ResearchZip 'invalid.zip' 'UNKNOWN'
            Write-Output 'E4B_WINDOWS_PS51_ZIP_METADATA_4_OF_4_PASS_NO_EXTRACTION'
          } finally {
            if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
          }

      - name: Verify isolated E3 R3 research signature on Windows PS51 (no release)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $PWD 'research/eo03/e4b/E3R3_RSA_SHA256_MockVerify_PS51.ps1'
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'E3R3_MOCK_VERIFY_SCRIPT_PARSER_FAILURE' }
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1*') { throw 'E3R3_NOT_PS51' }
          $lines = @(& $file)
          $required = @(
            'E3R3_RSA_PS51_MOCK_POSITIVE_PASS',
            'E3R3_RSA_PS51_WRONG_RUN_BLOCK_PASS',
            'E3R3_RSA_PS51_WRONG_SIGNATURE_BLOCK_PASS',
            'E3R3_RSA_PS51_WRONG_ARTIFACT_BLOCK_PASS',
            'E3R3_RSA_PS51_4_OF_4_MOCK_BOUNDARY_CHECKS_PASS_RELEASE_APPROVED_FALSE'
          )
          foreach ($marker in $required) { if ($marker -notin $lines) { throw ('E3R3_MOCK_MARKER_MISSING:' + $marker) } }
          $lines | Write-Output

      - name: E3R11 synthetic Technical child byte and input gate (no child execution)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $PWD 'research/eo03/e4b/E3R11_SyntheticChild_Gate_PS51.ps1'
          $tokens=$null; $errors=$null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw 'E3R11_TEST_SCRIPT_PARSER_FAIL' }
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1*') { throw 'E3R11_HOST_NOT_PS51' }
          $lines=@(& $file)
          $must=@('E3R11_VALID_CHILD_EXACT_BYTES_PASS','E3R11_TYPED_INPUT_NEGATIVES_PASS','E3R11_PATH_AND_INPUT_NEGATIVES_PASS','E3R11_TAMPERED_VALID_SYNTAX_CHILD_BLOCK_PASS','E3R11_PARSER_PASS_IS_NOT_APPROVAL_PASS','E3R11_NO_CHILD_EXECUTION_RELEASE_APPROVED_FALSE')
          foreach($name in $must){if($name -notin $lines){throw ('E3R11_MARKER_MISSING_'+$name)}}
          $lines | Write-Output
